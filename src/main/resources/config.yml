language: de

kill-message:
  enabled: true

kits:
  clear-before-give: false
  clear-before-equip: true

exempt-players: []

armor:
  notify-blocked: true

fake-names:
  auto-refill: true
  target-pool-size: 60
  low-water-mark: 25
  batch-size: 10
  refill-interval-seconds: 300
  request-spacing-millis: 1200
  max-attempts-per-identity: 25
  reuse-donor-skins: true
