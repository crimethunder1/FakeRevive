name: FakeLeaveAndRevive
version: ${project.version}
main: com.deathrevive.plugin.FakeLeaveAndRevivePlugin
api-version: '1.21'
depend: [packetevents]
description: Zeigt Todesnachricht + Fake-Leave und bietet /revive <Spieler/@a>.
commands:
  revive:
    description: Belebt einen oder alle Spieler aus dem Spectator-Modus wieder.
    permission: fakeleaveandrevive.revive
    permission-message: "§cDu hast keine Rechte für diesen Befehl!"
    usage: /revive <Spieler/@a> [Kit]
  undisguise:
    description: Entfernt die Verkleidung eines Spielers.
    permission: fakeleaveandrevive.revive
    permission-message: "§cDu hast keine Rechte für diesen Befehl!"
    usage: /undisguise [Spieler]
  kit:
    description: Verwaltet Server-Kits.
    permission: fakeleaveandrevive.revive
    permission-message: "§cDu hast keine Rechte für diesen Befehl!"
    usage: /kit save <Name> | /kit list
permissions:
  fakeleaveandrevive.revive:
    description: Erlaubt die Nutzung von /revive.
    default: op
