name: FakeRevive
version: ${project.version}
main: com.deathrevive.plugin.FakeRevivePlugin
api-version: '1.21'
depend: [packetevents]
description: On death, fakes a leave message and disguises players on revive.
commands:
  fr:
    description: Main command for FakeRevive.
    permission: fakerevive.admin
    permission-message: "§cYou don't have permission to use this command."
    usage: /fr <revive|undisguise|kit|reload>
    aliases: [fakerevive]
permissions:
  fakerevive.admin:
    description: Grants access to all /fr subcommands.
    default: op
